<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích của tôi</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- 1. Liên kết mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">
                Trang chủ GitHub (Mở trong tab mới)
            </a>
        </li>

        <!-- 2. Liên kết đến các trang web khác -->
        <li>
            <a href="https://www.google.com">Tìm kiếm Google</a>
        </li>
        <li>
            <a href="https://developer.mozilla.org">MDN Web Docs</a>
        </li>

        <!-- 3. Liên kết đến file HTML khác trong cùng thư mục -->
        <li>
            <a href="about.html">Giới thiệu về tôi (Trang nội bộ)</a>
        </li>

        <!-- 4. Liên kết đến Email (mailto:) -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
